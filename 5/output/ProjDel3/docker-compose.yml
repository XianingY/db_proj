name: research-lab-manager

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research_lab}
      POSTGRES_USER: ${POSTGRES_USER:-lab_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab_pass}
      TZ: Asia/Shanghai
    volumes:
      - lab_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab_user} -d ${POSTGRES_DB:-research_lab}"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      LAB_DSN: host=db port=5432 dbname=${POSTGRES_DB:-research_lab} user=${POSTGRES_USER:-lab_user} password=${POSTGRES_PASSWORD:-lab_pass}
      LAB_SCHEMA: ${LAB_SCHEMA:-research_lab_del3}
      LAB_WEB_HOST: 0.0.0.0
      LAB_WEB_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8000},http://127.0.0.1:${WEB_PORT:-8000}
      TZ: Asia/Shanghai
    ports:
      - "${WEB_PORT:-8000}:${WEB_PORT:-8000}"
    command: ["--web", "--port", "${WEB_PORT:-8000}"]
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  lab_pg_data:
